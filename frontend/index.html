<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#080A0F" />
    <meta name="color-scheme" content="dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>InstaManager</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      html {
        height: 100%;
        overflow-x: hidden;
        width: 100%;
        max-width: 100vw;
      }

      body {
        background: #080A0F;
        color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
        height: 100%;
        width: 100%;
        max-width: 100vw;
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        /* Prevent text size adjustment on rotation */
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }

      /* ---- Floating light: two layers of soft colour that drift slowly (transform only = smooth, cheap) ---- */
      body::before, body::after { content: ''; position: fixed; inset: -25%; z-index: 0; pointer-events: none; will-change: transform; }
      body::before {
        background:
          radial-gradient(34% 28% at 22% 16%, rgba(230,53,106,.36), transparent 70%),
          radial-gradient(30% 26% at 82% 22%, rgba(168,85,247,.36), transparent 70%);
        animation: drift1 28s ease-in-out infinite alternate;
      }
      body::after {
        background:
          radial-gradient(36% 30% at 72% 84%, rgba(56,189,248,.22), transparent 70%),
          radial-gradient(28% 26% at 12% 78%, rgba(249,115,22,.20), transparent 70%);
        animation: drift2 34s ease-in-out infinite alternate;
      }
      @keyframes drift1 { from { transform: translate3d(-3%, -2%, 0) scale(1); } to { transform: translate3d(4%, 6%, 0) scale(1.1); } }
      @keyframes drift2 { from { transform: translate3d(3%, 3%, 0) scale(1.05); } to { transform: translate3d(-5%, -4%, 0) scale(.95); } }
      @keyframes bob    { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
      @keyframes sweep  { 0%,55% { transform: translateX(-130%) skewX(-18deg); } 100% { transform: translateX(260%) skewX(-18deg); } }
      @property --ang { syntax: '<angle>'; inherits: false; initial-value: 0deg; }
      @keyframes spinAng { to { --ang: 360deg; } }

      /* ---- 3D tilt + light that follows your finger/cursor (class "tilt", driven by one listener in App.jsx) ---- */
      .tilt {
        position: relative;
        transform: perspective(900px) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg));
        transition: transform .5s var(--ease), box-shadow .3s, border-color .3s;
        will-change: transform;
      }
      .tilt.tilting { transition: transform .08s linear, box-shadow .3s, border-color .3s; }
      .tilt.fade-up { animation-fill-mode: backwards; }   /* so the entrance animation doesn't lock the transform */
      .tilt.removing { transform: translateX(24px) scale(.96); }
      .tilt::after {
        content: ''; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
        opacity: var(--glow, 0); transition: opacity .3s;
        background: radial-gradient(240px circle at var(--mx, 50%) var(--my, 0%), rgba(255,255,255,.13), transparent 65%);
      }
      @media (hover: hover) {
        .tilt.card-hover:hover { transform: perspective(900px) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)) translateY(-3px); }
      }

      /* ---- Glass surface: soft light gradient, bright top edge, deep shadow ---- */
      .glass {
        background: linear-gradient(145deg, rgba(255,255,255,.07), rgba(255,255,255,.018)) !important;
        border-color: rgba(255,255,255,.09) !important;
        box-shadow: inset 0 1px 0 rgba(255,255,255,.10), 0 22px 44px -24px rgba(0,0,0,.85);
      }

      /* ---- Main buttons: glow + a light sweep that passes across every few seconds ---- */
      .shine { position: relative; overflow: hidden; box-shadow: 0 10px 28px -8px rgba(230,53,106,.55), inset 0 1px 0 rgba(255,255,255,.25); }
      .shine:disabled { box-shadow: none; }
      .shine::after {
        content: ''; position: absolute; top: 0; bottom: 0; left: 0; width: 60%; pointer-events: none;
        background: linear-gradient(105deg, transparent, rgba(255,255,255,.34), transparent);
        transform: translateX(-130%) skewX(-18deg); animation: sweep 4.2s ease-in-out infinite;
      }
      .shine:disabled::after { display: none; }

      /* ---- Floating bottom dock: gentle float + a light that travels around its edge ---- */
      .dock { animation: bob 6s ease-in-out infinite; }
      .dock::before {
        content: ''; position: absolute; inset: 0; border-radius: inherit; padding: 1px; pointer-events: none;
        background: conic-gradient(from var(--ang), transparent 0 62%, rgba(230,53,106,.95) 78%, rgba(168,85,247,.95) 90%, transparent 100%);
        -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
        -webkit-mask-composite: xor; mask-composite: exclude;
        animation: spinAng 7s linear infinite;
      }
      .float { animation: bob 4.5s ease-in-out infinite; }

      #root {
        position: relative; z-index: 1;
        height: 100%;
        width: 100%;
        max-width: 100vw;
        overflow-x: hidden;
      }

      @keyframes spin     { to { transform: rotate(360deg); } }
      @keyframes pulse    { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
      @keyframes fadeIn   { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes slideUp  { from { transform: translateY(100%); } to { transform: translateY(0); } }
      @keyframes fadeUp   { from { opacity: 0; transform: translateY(14px) scale(.985); } to { opacity: 1; transform: none; } }
      @keyframes popIn    { from { opacity: 0; transform: translateY(-6px) scale(.95); } to { opacity: 1; transform: none; } }
      @keyframes shimmer  { 0% { background-position: -400px 0; } 100% { background-position: 400px 0; } }
      @keyframes toastIn  { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: none; } }
      @keyframes expand   { from { opacity: 0; transform: translateY(-10px) scaleY(.96); } to { opacity: 1; transform: none; } }
      @keyframes floaty   { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }

      :root { --ease: cubic-bezier(.22,1,.36,1); }

      /* ---- Motion helpers (use via className) ---- */
      .tab-enter  { animation: fadeUp .38s var(--ease) both; }
      .fade-up    { animation: fadeUp .45s var(--ease) both; }
      .pop-in     { animation: popIn .18s var(--ease) both; transform-origin: top right; }
      .toast      { animation: toastIn .3s var(--ease) both; }
      .expand     { animation: expand .3s var(--ease) both; transform-origin: top; }
      .floaty     { animation: floaty 3s ease-in-out infinite; }
      .removing   { opacity: 0; transform: translateX(24px) scale(.96); transition: all .25s var(--ease); pointer-events: none; }
      .skeleton   {
        background: linear-gradient(90deg, rgba(255,255,255,.04) 25%, rgba(255,255,255,.09) 37%, rgba(255,255,255,.04) 63%);
        background-size: 800px 100%; animation: shimmer 1.4s linear infinite; border-radius: 12px;
      }
      .card-hover { transition: transform .25s var(--ease), border-color .25s, background .25s, box-shadow .25s; }

      /* ---- Global interaction feel (applies to every component) ---- */
      button, [role="button"], label, select {
        transition: transform .18s var(--ease), background-color .2s, border-color .2s, color .2s, opacity .2s, box-shadow .2s, filter .2s;
        -webkit-user-select: none; user-select: none; touch-action: manipulation;
      }
      button:not(:disabled):active { transform: scale(.96); }
      button:disabled { cursor: not-allowed; }
      @media (hover: hover) {
        button:not(:disabled):hover { filter: brightness(1.15); }
        .card-hover:hover { transform: translateY(-2px); border-color: rgba(168,85,247,.25) !important; box-shadow: 0 10px 30px rgba(0,0,0,.35); }
      }
      input, textarea, select { transition: border-color .2s, box-shadow .2s, background .2s; }
      :focus-visible { outline: 2px solid rgba(168,85,247,.7); outline-offset: 2px; }
      html { scroll-behavior: smooth; }
      body { overscroll-behavior-y: none; }

      /* Respect users who prefer less motion */
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
      }

      input, textarea, select {
        -webkit-appearance: none;
        appearance: none;
        max-width: 100%;
      }
      input:focus, textarea:focus, select:focus {
        outline: none;
        border-color: rgba(168,85,247,0.5) !important;
        box-shadow: 0 0 0 3px rgba(168,85,247,0.1);
      }
      select option { background: #111; color: #fff; }

      ::-webkit-scrollbar { width: 4px; height: 4px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }

      input[type="datetime-local"]::-webkit-calendar-picker-indicator { filter: invert(0.5); }

      input[type="range"] {
        -webkit-appearance: none;
        height: 4px;
        border-radius: 4px;
        background: rgba(255,255,255,0.1);
        outline: none;
        width: 100%;
      }
      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: #a855f7;
        cursor: pointer;
        box-shadow: 0 2px 8px rgba(168,85,247,0.4);
      }

      * { -webkit-tap-highlight-color: transparent; }
      .safe-bottom { padding-bottom: env(safe-area-inset-bottom, 0px); }

      /* Prevent any element from causing horizontal scroll */
      img, video, canvas, iframe {
        max-width: 100%;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
